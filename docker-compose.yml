version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: drc_gov_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drc_gov_db}
      POSTGRES_USER: ${POSTGRES_USER:-drc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drc_secret_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drc_admin} -d ${POSTGRES_DB:-drc_gov_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: drc_gov_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
  redis_data:

