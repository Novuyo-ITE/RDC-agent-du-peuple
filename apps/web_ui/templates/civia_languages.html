<div class="civia-language-list" role="group" aria-label="Langues de l’assistant">
    <label><span>Français</span><input type="radio" name="{{ group }}" value="fr" data-civia-lang></label>
    <label><span>Lingála</span><input type="radio" name="{{ group }}" value="ln" data-civia-lang></label>
    <label><span>Kiswahili</span><input type="radio" name="{{ group }}" value="sw" data-civia-lang></label>
    <label class="civia-unavailable-language"><span>Tshiluba <small>Indisponible</small></span><input type="radio" name="{{ group }}" value="lua" disabled></label>
    <label class="civia-unavailable-language"><span>Kikongo <small>Indisponible</small></span><input type="radio" name="{{ group }}" value="kg" disabled></label>
    <label><span>English</span><input type="radio" name="{{ group }}" value="en" data-civia-lang></label>
</div>
