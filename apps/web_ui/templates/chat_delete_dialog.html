<dialog id="chat-delete-dialog" aria-labelledby="chat-delete-title" aria-describedby="chat-delete-description" class="chat-delete-dialog">
    <div class="chat-delete-content">
        <div class="chat-delete-icon" aria-hidden="true"><i data-lucide="trash-2" class="w-6 h-6"></i></div>
        <h2 id="chat-delete-title">Supprimer cette conversation ?</h2>
        <p id="chat-delete-description">Cette conversation et tous ses messages seront supprimés de votre historique. Cette action est définitive.</p>
        <p id="chat-delete-name" class="chat-delete-name"></p>
        <p id="chat-delete-error" class="chat-delete-error" role="alert" hidden></p>
        <div class="chat-delete-actions">
            <button id="chat-delete-cancel" type="button" autofocus>Annuler</button>
            <button id="chat-delete-confirm" type="button">Supprimer</button>
        </div>
    </div>
</dialog>
